version: '3.8'

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

volumes:
  pgdata:
  joomladata:
  grafanadata:

services:
  # 1. Base de datos PostgreSQL
  database:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. CMS Joomla
  joomla:
    image: joomla:latest
    container_name: joomla_cms
    restart: always
    environment:
      JOOMLA_DB_HOST: database
      JOOMLA_DB_TYPE: pgsql
      JOOMLA_DB_USER: ${POSTGRES_USER}
      JOOMLA_DB_PASSWORD: ${POSTGRES_PASSWORD}
      JOOMLA_DB_NAME: ${POSTGRES_DB}
    volumes:
      - joomladata:/var/www/html
    networks:
      - frontend_net
      - backend_net
    depends_on:
      database:
        condition: service_healthy

  
# 3. Servidor Jupyter Notebooks
  jupyter:
    image: jupyter/base-notebook:latest
    container_name: jupyter_notebook
    restart: always
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
    # Se añade la instalación de pip antes de iniciar el notebook
    command: >
      bash -c "pip install --no-cache-dir psycopg2-binary pandas sqlalchemy matplotlib &&
               start-notebook.sh --ServerApp.base_url='/jupyter/' --ServerApp.token='secrettoken123' --ServerApp.allow_origin='*'"
    volumes:
      - ./jupyter/notebooks:/home/jovyan/work
    networks:
      - backend_net

  # 4. Servidor de Monitoreo Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana_dashboard
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_ROOT_URL=http://localhost/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    networks:
      - backend_net
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning

  # 5. Proxy Inverso Nginx (Único expuesto a Internet / Puerto 80)
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend_net
      - backend_net
    depends_on:
      - joomla
      - jupyter
      - grafana